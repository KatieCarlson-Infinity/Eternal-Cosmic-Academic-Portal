<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Cosmic | Academic Infinity Portal</title>
    <!-- Add Google Font for Cinzel heading if you want -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* PASTE YOUR NEW COSMIC GLASSMORPHISM CSS HERE */
        :root {
            /* Cosmic Palette */
            --bg-space: #070913;
            --bg-surface-glass: rgba(18, 22, 41, 0.65);
            --border-glass: rgba(147, 112, 219, 0.25);
            
            /* Vibrant Accents */
            --accent-nebula: #9d4edd;
            --accent-starlight: #e0aaff;
            --accent-crystal: #72efdd;
            --text-primary: #f8f9fa;
            --text-secondary: #a0aabf;

            /* Typography */
            --font-heading: 'Cinzel', 'Trajan Pro', serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-space);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism Card System */
        .glass-card {
            background: var(--bg-surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-crystal);
        }

        /* (Keep the rest of your original styles below this) */
    </style>
</head>
